<div class="d-inline-block ms-1" ngbDropdown #fileHunterDropdown="ngbDropdown">
    <button class="btn btn-secondary btn-sm file-hunter-button" type="button"
        [title]="'popups.quicklaunch.filehuntergames' | translate" ngbDropdownToggle>
        <span class="bi-globe2"></span>
    </button>
    <div ngbDropdownMenu class="pt-2 pb-2 games-list">
        <div [ngClass]="isListMode() ? 'd-block' : 'd-none'">
            <span class="badge bg-primary bg-size ms-1">{{ 'popups.quicklaunch.gamelist' | translate }}</span>
            <a class="badge bg-dark bg-size bg-link" (click)="setNewAdditionsMode()">{{
                'popups.quicklaunch.newadditions' | translate }}</a>
            <app-file-hunter-games-list (gameLink)="selectLink($event)"></app-file-hunter-games-list>
        </div>
        <div [ngClass]="isNewAdditionsMode() ? 'd-block' : 'd-none'">
            <a class="badge bg-dark bg-size bg-link ms-1" (click)="setListMode()">{{ 'popups.quicklaunch.gamelist' |
                translate }}</a>
            <span class="badge bg-primary bg-size">{{ 'popups.quicklaunch.newadditions' | translate }}</span>
            <app-file-hunter-new-additions (gameLink)="selectLink($event)"></app-file-hunter-new-additions>
        </div>
    </div>
</div>
